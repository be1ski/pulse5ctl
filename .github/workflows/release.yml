name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ steps.version.outputs.tag }} --generate-notes

  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift tests
        run: swift test

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e . pytest pytest-asyncio ruff
      - name: Lint with ruff
        run: ruff check pulse5/ tests/
      - name: Run tests
        run: pytest

  macos-app:
    needs: [swift-test, create-release]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Inject version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.create-release.outputs.version }}" Sources/app/macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.create-release.outputs.version }}" Sources/app/macos/Info.plist

      - name: Build release binary
        run: swift build -c release --product pulse5ctl

      - name: Package app bundle
        run: make package

      - name: Create zip
        run: ditto -c -k --keepParent pulse5ctl.app pulse5ctl-${{ needs.create-release.outputs.tag }}.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.create-release.outputs.tag }} pulse5ctl-${{ needs.create-release.outputs.tag }}.zip

  pypi:
    needs: [python-tests, create-release]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set version from tag
        working-directory: cli
        run: sed -i "s/version = \"0.0.0\"/version = \"${{ needs.create-release.outputs.version }}\"/" pyproject.toml

      - name: Build package
        working-directory: cli
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist/

  homebrew:
    needs: [macos-app, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Cask
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.tag }}
        run: |
          APP_VERSION="${VERSION#v}"
          ZIP_URL="https://github.com/be1ski/pulse5ctl/releases/download/${VERSION}/pulse5ctl-${VERSION}.zip"

          curl -sL "$ZIP_URL" -o pulse5ctl.zip
          SHA256=$(shasum -a 256 pulse5ctl.zip | awk '{print $1}')
          rm pulse5ctl.zip

          git clone "https://x-access-token:${COMMITTER_TOKEN}@github.com/be1ski/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks

          cat > Casks/pulse5ctl.rb << CASK
          cask "pulse5ctl" do
            version "$APP_VERSION"
            sha256 "$SHA256"

            url "https://github.com/be1ski/pulse5ctl/releases/download/v#{version}/pulse5ctl-v#{version}.zip"
            name "pulse5ctl"
            desc "Pulse 5 speaker controller — macOS menu bar app"
            homepage "https://github.com/be1ski/pulse5ctl"

            depends_on macos: ">= :ventura"

            app "pulse5ctl.app"

            postflight do
              system "xattr", "-cr", "#{appdir}/pulse5ctl.app"
            end

            zap trash: [
              "~/Library/Preferences/space.be1ski.pulse5ctl.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pulse5ctl.rb
          git rm -f Formula/pulse5ctl.rb 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "pulse5ctl $APP_VERSION"
            git push
          fi
