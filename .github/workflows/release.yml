name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release --product pulse5ctl

      - name: Package app bundle
        run: |
          mkdir -p pulse5ctl.app/Contents/MacOS
          mkdir -p pulse5ctl.app/Contents/Resources
          cp .build/release/pulse5ctl pulse5ctl.app/Contents/MacOS/
          cp Sources/app/macos/Info.plist pulse5ctl.app/Contents/
          cp -R .build/release/pulse5ctl_CoreLocalization.bundle pulse5ctl.app/Contents/Resources/
          chmod +x pulse5ctl.app/Contents/MacOS/pulse5ctl

      - name: Create zip
        run: ditto -c -k --keepParent pulse5ctl.app pulse5ctl-${{ github.event.release.tag_name }}.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} pulse5ctl-${{ github.event.release.tag_name }}.zip

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        working-directory: cli
        run: sed -i "s/version = \"0.0.0\"/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml

      - name: Build package
        working-directory: cli
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/dist/
