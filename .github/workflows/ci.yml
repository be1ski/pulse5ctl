name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . pytest pytest-asyncio ruff

      - name: Lint with ruff
        run: ruff check pulse5/ tests/

      - name: Run tests
        run: pytest

  swift-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build
