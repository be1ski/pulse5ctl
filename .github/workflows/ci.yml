name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . pytest pytest-asyncio pytest-cov ruff

      - name: Lint with ruff
        run: ruff check pulse5/ tests/

      - name: Run tests with coverage
        run: pytest --cov --cov-branch --cov-report=xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          files: cli/coverage.xml

  swift-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift
        run: swiftlint lint --strict

      - name: Run Swift tests
        run: swift test --enable-code-coverage

      - name: Convert Swift coverage to lcov
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -path '*/codecov/*')
          XCTEST=$(find "$BIN" -name '*.xctest' -type d | head -1)
          xcrun llvm-cov export \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            -instr-profile="$PROFDATA" \
            -format=lcov > coverage.lcov

      - name: Upload Swift coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: swift
          files: coverage.lcov
