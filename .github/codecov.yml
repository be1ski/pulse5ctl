coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 93%

ignore:
  - "**/di/**"
  - "**/view/**"
  - "Sources/app/**"
  - "**/*Action.swift"
  - "**/*Effect.swift"
  - "**/*State.swift"
  # Platform-specific (CoreBluetooth, CoreAudio) — untestable without hardware
  - "**/bluetooth/BluetoothManager.swift"
  - "**/nowplaying/**"
  - "Sources/core/platform/**"
  - "**/repository/PulseSpeakerRepositoryImpl.swift"
